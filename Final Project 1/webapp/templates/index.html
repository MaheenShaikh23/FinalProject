<!DOCTYPE html>
<html lang="en">
<head>
    <title>Waste Prediction</title>
</head>
<body>
    <h2>Enter Data for Prediction</h2>
    <form id="predict-form">
        <input type="text" id="population" placeholder="Population"><br>
        <input type="text" id="gdp_per_capita" placeholder="GDP per Capita"><br>
        <input type="text" id="recycling_rate" placeholder="Recycling Rate"><br>
        <button type="submit">Predict</button>
    </form>
    <h3 id="result"></h3>

    <script>
        document.getElementById("predict-form").onsubmit = async (event) => {
            event.preventDefault();
            let inputData = {
                population: parseFloat(document.getElementById("population").value),
                gdp_per_capita: parseFloat(document.getElementById("gdp_per_capita").value),
                recycling_rate: parseFloat(document.getElementById("recycling_rate").value),
            };
            let response = await fetch("/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(inputData),
            });
            let result = await response.json();
            document.getElementById("result").innerText = "Predicted Waste: " + result.predicted_waste + " kg";
        };
    </script>
</body>
</html>
